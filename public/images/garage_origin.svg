<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="benchWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#451a03" />
      <stop offset="50%" stopColor="#78350f" />
      <stop offset="100%" stopColor="#451a03" />
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#b45309" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>
    <filter id="lampGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brick / Wood Garage Wall -->
  <rect width="600" height="400" fill="url(#wallGrad)" />
  <line x1="0" y1="260" x2="600" y2="260" stroke="#334155" stroke-width="2" />
  
  <!-- Concrete Garage Floor -->
  <rect y="260" width="600" height="140" fill="#0b0f19" />

  <!-- Pegboard with Hanging Hand Tools -->
  <rect x="50" y="30" width="500" height="120" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1.5" />
  <!-- Wire Spool on Pegboard -->
  <circle cx="100" cy="80" r="26" fill="url(#copper)" stroke="#92400e" stroke-width="2" />
  <circle cx="100" cy="80" r="10" fill="#1e2433" />
  <!-- Wire Spool 2 -->
  <circle cx="160" cy="80" r="20" fill="#047857" stroke="#065f46" stroke-width="2" />
  <circle cx="160" cy="80" r="8" fill="#1e2433" />
  <!-- Pliers / Wire Cutters -->
  <path d="M220 50 L240 100 M240 50 L220 100" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <circle cx="230" cy="75" r="4" fill="#ef4444" />
  <!-- Screwdrivers -->
  <path d="M280 45 L280 110" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
  <path d="M305 45 L305 105" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" />
  <path d="M330 45 L330 115" stroke="#10b981" stroke-width="5" stroke-linecap="round" />

  <!-- Hanging Drafting Lamp with Warm Glow -->
  <g transform="translate(450, 40)">
    <line x1="0" y1="0" x2="30" y2="80" stroke="#64748b" stroke-width="3" />
    <path d="M10 80 L50 80 L40 100 L20 100 Z" fill="#475569" stroke="#64748b" />
    <polygon points="30,100 -40,240 100,240" fill="#fef08a" opacity="0.12" />
    <circle cx="30" cy="98" r="6" fill="#fef08a" filter="url(#lampGlow)" />
  </g>

  <!-- Heavy Wooden Workbench Table -->
  <rect x="30" y="220" width="540" height="30" rx="4" fill="url(#benchWood)" stroke="#92400e" stroke-width="2" />
  <rect x="50" y="250" width="24" height="130" fill="#451a03" />
  <rect x="526" y="250" width="24" height="130" fill="#451a03" />

  <!-- Equipment on Bench: Weller Soldering Station -->
  <g transform="translate(100, 160)">
    <rect x="0" y="20" width="70" height="40" rx="6" fill="#0f766e" stroke="#115e59" stroke-width="2" />
    <circle cx="20" cy="40" r="8" fill="#1e293b" />
    <circle cx="50" cy="35" r="4" fill="#ef4444" filter="url(#lampGlow)" />
    <!-- Iron Resting in Spring Stand -->
    <path d="M70 45 Q 90 20 110 5" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <rect x="105" y="0" width="25" height="10" rx="2" fill="#d97706" />
    <path d="M130 5 L145 5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <circle cx="145" cy="5" r="2" fill="#ef4444" />
  </g>

  <!-- Bundles of Coiled AC Power Cables (First T0 Product) -->
  <g transform="translate(300, 190)">
    <ellipse cx="60" cy="20" rx="50" ry="12" fill="none" stroke="#1e293b" stroke-width="8" />
    <ellipse cx="60" cy="20" rx="44" ry="10" fill="none" stroke="#0f172a" stroke-width="6" />
    <rect x="105" y="14" width="16" height="12" rx="3" fill="#334155" />
    <!-- US 3-Prong Pins -->
    <line x1="121" y1="17" x2="128" y2="17" stroke="#fbbf24" stroke-width="2" />
    <line x1="121" y1="23" x2="128" y2="23" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Wooden Parts Bin with Toggle Switches & Connectors -->
  <g transform="translate(430, 175)">
    <rect x="0" y="0" width="110" height="45" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />
    <line x1="55" y1="0" x2="55" y2="45" stroke="#475569" stroke-width="1.5" />
    <!-- Switches poking out -->
    <line x1="20" y1="15" x2="15" y2="0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="18" x2="38" y2="2" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <!-- Multi-pin connectors -->
    <rect x="68" y="10" width="20" height="8" fill="#1e293b" />
    <circle cx="72" cy="14" r="1.5" fill="#fbbf24" />
    <circle cx="78" cy="14" r="1.5" fill="#fbbf24" />
    <circle cx="84" cy="14" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Label Badge -->
  <rect x="20" y="350" width="220" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="30" y="371" font-family="'Courier New', monospace" font-size="12" fill="#10b981" font-weight="bold">
    ORIGIN: 1952 GARAGE WORKBENCH
  </text>
</svg>
