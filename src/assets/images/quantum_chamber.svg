<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="quantumChamberBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#050314" />
      <stop offset="50%" stopColor="#0b0826" />
      <stop offset="100%" stopColor="#020108" />
    </linearGradient>
    <linearGradient id="goldChandelier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#d97706" />
      <stop offset="30%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#fef08a" />
      <stop offset="70%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
    <filter id="qubitGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#quantumChamberBg)" />

  <!-- Quantum Particle Resonance Waves -->
  <g opacity="0.25">
    <ellipse cx="300" cy="220" rx="240" ry="140" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" />
    <ellipse cx="300" cy="220" rx="180" ry="100" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" />
    <ellipse cx="300" cy="220" rx="120" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Dilution Refrigerator "Golden Chandelier" -->
  <g transform="translate(300, 20)">
    <!-- Stage 0: 300K Flange (Top) -->
    <rect x="-120" y="0" width="240" height="18" rx="4" fill="url(#goldChandelier)" stroke="#78350f" stroke-width="1.5" />
    
    <!-- Stage 1: 50K Plate -->
    <line x1="-90" y1="18" x2="-90" y2="60" stroke="#f59e0b" stroke-width="4" />
    <line x1="-30" y1="18" x2="-30" y2="60" stroke="#f59e0b" stroke-width="4" />
    <line x1="30" y1="18" x2="30" y2="60" stroke="#f59e0b" stroke-width="4" />
    <line x1="90" y1="18" x2="90" y2="60" stroke="#f59e0b" stroke-width="4" />
    <!-- Coaxial RF Microwave lines -->
    <path d="M-60 18 C -70 35, -50 45, -60 60" fill="none" stroke="#c084fc" stroke-width="2" />
    <path d="M60 18 C 70 35, 50 45, 60 60" fill="none" stroke="#c084fc" stroke-width="2" />
    <rect x="-100" y="60" width="200" height="16" rx="4" fill="url(#goldChandelier)" stroke="#78350f" stroke-width="1.5" />

    <!-- Stage 2: 4K Plate -->
    <line x1="-70" y1="76" x2="-70" y2="120" stroke="#f59e0b" stroke-width="3" />
    <line x1="-20" y1="76" x2="-20" y2="120" stroke="#f59e0b" stroke-width="3" />
    <line x1="20" y1="76" x2="20" y2="120" stroke="#f59e0b" stroke-width="3" />
    <line x1="70" y1="76" x2="70" y2="120" stroke="#f59e0b" stroke-width="3" />
    <path d="M-45 76 C -55 95, -35 105, -45 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M45 76 C 55 95, 35 105, 45 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="-80" y="120" width="160" height="14" rx="3" fill="url(#goldChandelier)" stroke="#78350f" stroke-width="1.5" />

    <!-- Stage 3: Still & Mixing Chamber (100 mK -> 15 mK) -->
    <line x1="-50" y1="134" x2="-50" y2="180" stroke="#f59e0b" stroke-width="2.5" />
    <line x1="0" y1="134" x2="0" y2="180" stroke="#f59e0b" stroke-width="2.5" />
    <line x1="50" y1="134" x2="50" y2="180" stroke="#f59e0b" stroke-width="2.5" />
    <rect x="-60" y="180" width="120" height="12" rx="3" fill="url(#goldChandelier)" stroke="#78350f" stroke-width="1.5" />

    <!-- Stage 4: Quantum Processing Shielding Can (15 Millikelvin Base) -->
    <rect x="-35" y="192" width="70" height="50" rx="8" fill="#18181b" stroke="#a855f7" stroke-width="2.5" />
    
    <!-- Entangled Superconducting Qubit Core -->
    <circle cx="0" cy="217" r="14" fill="#a855f7" filter="url(#qubitGlow)" />
    <circle cx="0" cy="217" r="6" fill="#f5d0fe" />
    <path d="M-10 217 L10 217 M0 207 L0 227" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Left / Right Cryogenic Support Tanks -->
  <g transform="translate(60, 200)">
    <rect width="60" height="130" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="30" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" font-weight="bold">
      LIQUID
    </text>
    <text x="30" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" font-weight="bold">
      He-3/He-4
    </text>
  </g>

  <g transform="translate(480, 200)">
    <rect width="60" height="130" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="30" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" font-weight="bold">
      VACUUM
    </text>
    <text x="30" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" font-weight="bold">
      10⁻⁷ TORR
    </text>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="350" width="280" height="32" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
  <text x="30" y="371" font-family="'Courier New', monospace" font-size="12" fill="#a855f7" font-weight="bold">
    FACILITY: QUANTUM CRYOGENIC CORE
  </text>
</svg>
