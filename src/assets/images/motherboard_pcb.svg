<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="chipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="traceCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- PCB Substrate (Deep emerald solder mask) -->
  <rect width="400" height="300" rx="12" fill="#022c22"/>
  <rect x="15" y="15" width="370" height="270" rx="6" fill="#064e3b" stroke="#047857" stroke-width="2"/>

  <!-- Copper Bus Traces -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M 30 40 L 120 40 L 150 70 L 220 70"/>
    <path d="M 30 48 L 115 48 L 145 78 L 220 78"/>
    <path d="M 30 56 L 110 56 L 140 86 L 220 86"/>
    <path d="M 30 64 L 105 64 L 135 94 L 220 94"/>
    
    <path d="M 290 70 L 340 70 L 365 95 L 365 240"/>
    <path d="M 290 78 L 335 78 L 358 101 L 358 240"/>
    <path d="M 290 86 L 330 86 L 351 107 L 351 240"/>

    <path d="M 220 180 L 180 220 L 60 220"/>
    <path d="M 230 180 L 190 226 L 60 226"/>
    <path d="M 240 180 L 200 232 L 60 232"/>
  </g>

  <!-- Solder Vias (Golden dots) -->
  <g fill="#fbbf24">
    <circle cx="30" cy="40" r="2.5"/><circle cx="30" cy="48" r="2.5"/><circle cx="30" cy="56" r="2.5"/><circle cx="30" cy="64" r="2.5"/>
    <circle cx="60" cy="220" r="2.5"/><circle cx="60" cy="226" r="2.5"/><circle cx="60" cy="232" r="2.5"/>
    <circle cx="365" cy="240" r="2.5"/><circle cx="358" cy="240" r="2.5"/><circle cx="351" cy="240" r="2.5"/>
    <!-- Random test point vias -->
    <circle cx="160" cy="40" r="2"/><circle cx="180" cy="40" r="2"/><circle cx="200" cy="40" r="2"/>
    <circle cx="330" cy="40" r="2"/><circle cx="350" cy="40" r="2"/>
    <circle cx="100" cy="180" r="2"/><circle cx="120" cy="180" r="2"/>
  </g>

  <!-- Main CPU Socket (LGA / PGA frame) -->
  <rect x="220" y="65" width="70" height="70" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="230" y="75" width="50" height="50" rx="2" fill="#1e293b"/>
  <circle cx="255" cy="100" r="18" fill="url(#chipGlow)"/>
  <text x="240" y="103" fill="#6ee7b7" font-size="8" font-family="monospace" font-weight="bold">CPU ZIF</text>

  <!-- RAM DIMM Slots (2 slots) -->
  <g fill="#020617" stroke="#94a3b8" stroke-width="1">
    <rect x="305" y="45" width="10" height="110" rx="1"/>
    <rect x="325" y="45" width="10" height="110" rx="1"/>
    <!-- RAM Notch -->
    <line x1="305" y1="100" x2="315" y2="100" stroke="#fbbf24" stroke-width="2"/>
    <line x1="325" y1="100" x2="335" y2="100" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="312" y="165" fill="#94a3b8" font-size="7" font-family="monospace">DIMM_A1</text>

  <!-- PCIe x16 Expansion Slot -->
  <rect x="60" y="150" width="150" height="12" rx="2" fill="#020617" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="150" x2="90" y2="162" stroke="#fbbf24" stroke-width="2"/>
  <text x="80" y="145" fill="#a7f3d0" font-size="8" font-family="monospace">PCIe 5.0 x16</text>

  <!-- VRM Power Delivery Stages (Solid Capacitors + Chokes) -->
  <g fill="#1e293b" stroke="#38bdf8" stroke-width="1">
    <rect x="180" y="65" width="12" height="12" rx="2"/>
    <rect x="180" y="85" width="12" height="12" rx="2"/>
    <rect x="180" y="105" width="12" height="12" rx="2"/>
    <rect x="180" y="125" width="12" height="12" rx="2"/>
  </g>
  <g fill="#94a3b8" stroke="#475569">
    <circle cx="205" cy="71" r="5"/>
    <circle cx="205" cy="91" r="5"/>
    <circle cx="205" cy="111" r="5"/>
    <circle cx="205" cy="131" r="5"/>
  </g>

  <!-- Chipset PCH with Heat Sink -->
  <rect x="230" y="180" width="45" height="45" rx="3" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <line x1="235" y1="188" x2="270" y2="188" stroke="#047857" stroke-width="2"/>
  <line x1="235" y1="196" x2="270" y2="196" stroke="#047857" stroke-width="2"/>
  <line x1="235" y1="204" x2="270" y2="204" stroke="#047857" stroke-width="2"/>
  <line x1="235" y1="212" x2="270" y2="212" stroke="#047857" stroke-width="2"/>
  <text x="242" y="200" fill="#a7f3d0" font-size="7" font-family="monospace">CHIPSET</text>

  <!-- Rear I/O Shield Ports -->
  <rect x="20" y="80" width="18" height="55" rx="2" fill="#334155" stroke="#94a3b8"/>
  <rect x="23" y="85" width="12" height="8" fill="#020617"/>
  <rect x="23" y="98" width="12" height="8" fill="#020617"/>
  <circle cx="29" cy="120" r="4" fill="#020617"/>

  <!-- Spec Footer -->
  <text x="25" y="280" fill="#6ee7b7" font-family="monospace" font-size="10">SILICON DYNASTY • MAIN SYSTEM PCB ARCHITECTURE</text>
  <text x="325" y="280" fill="#fbbf24" font-family="monospace" font-size="10">REV 4.2</text>
</svg>
